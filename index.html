<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liquid Glass — iOS 27 Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
#stage{position:relative;width:min(1180px,100vw);aspect-ratio:1180/237;overflow:hidden;touch-action:none}
#bg2d{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#hit{position:absolute;z-index:5;cursor:grab;transform-origin:center;transition:transform .28s cubic-bezier(.2,.9,.2,1)}
#hit.drag{cursor:grabbing;transition:none}
#hit.snap{animation:magnet .36s cubic-bezier(.2,.9,.2,1)}
@keyframes magnet{
  0%{filter:brightness(1)}
  35%{filter:brightness(1.13)}
  100%{filter:brightness(1)}
}
.nav-hit{
  position:absolute;z-index:7;border:0;background:transparent;padding:0;margin:0;
  cursor:pointer;touch-action:manipulation;
}
#nav-more{left:135px;top:48px;width:170px;height:145px}
#nav-contacts{left:425px;top:48px;width:180px;height:145px}
#nav-keyboard{left:655px;top:48px;width:205px;height:145px}
.nav-hit:active{transform:scale(.96)}

#hint{display:none}
@media(max-width:600px){#stage{width:100vw}.hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg2d"></canvas>
  <canvas id="gl"></canvas>
  <div id="hit"></div>
  <button class="nav-hit" id="nav-more" aria-label="Ещё"></button>
  <button class="nav-hit" id="nav-contacts" aria-label="Контакты"></button>
  <button class="nav-hit" id="nav-keyboard" aria-label="Клавиатура"></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const W=1180,H=237, stage=document.getElementById('stage');
const bgCanvas=document.getElementById('bg2d'), bg=bgCanvas.getContext('2d');
bgCanvas.width=W; bgCanvas.height=H;

function rr(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);c.closePath();
}
function drawBackground(){
  bg.clearRect(0,0,W,H);
  bg.fillStyle='#000';bg.fillRect(0,0,W,H);

  // Colored light behind the glass, matching the reference.
  const blobs=[
    [205,93,78,'#1387ff'],[455,95,72,'#1688ff'],[300,143,75,'#5c35ff'],
    [520,43,48,'#008eff'],[185,48,45,'#00b7ff']
  ];
  for(const [x,y,r,col] of blobs){
    const g=bg.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col);g.addColorStop(.55,col);g.addColorStop(1,'transparent');
    bg.fillStyle=g;bg.beginPath();bg.arc(x,y,r,0,Math.PI*2);bg.fill();
  }

  // Main capsule.
  const panel={x:44,y:26,w:875,h:194,r:98};
  const grad=bg.createLinearGradient(0,panel.y,0,panel.y+panel.h);
  grad.addColorStop(0,'rgba(70,70,70,.72)');
  grad.addColorStop(1,'rgba(45,45,45,.72)');
  rr(bg,panel.x,panel.y,panel.w,panel.h,panel.r);bg.fillStyle=grad;bg.fill();
  bg.strokeStyle='rgba(255,255,255,.20)';bg.lineWidth=1;bg.stroke();
  bg.strokeStyle='rgba(255,255,255,.07)';bg.beginPath();bg.moveTo(85,27);bg.lineTo(875,27);bg.stroke();

  // Search bubble.
  const sx=1022,sy=129,sr=92;
  const sg=bg.createRadialGradient(sx-24,sy-30,5,sx,sy,sr);
  sg.addColorStop(0,'rgba(255,255,255,.19)');
  sg.addColorStop(.35,'rgba(100,100,100,.42)');
  sg.addColorStop(1,'rgba(35,35,35,.72)');
  bg.fillStyle=sg;bg.beginPath();bg.arc(sx,sy,sr,0,Math.PI*2);bg.fill();
  bg.strokeStyle='rgba(255,255,255,.24)';bg.lineWidth=1.2;bg.stroke();
  bg.strokeStyle='rgba(255,255,255,.07)';bg.beginPath();bg.arc(sx,sy,sr-3,Math.PI*1.05,Math.PI*1.78);bg.stroke();

  // Search icon.
  bg.strokeStyle='#fff';bg.lineWidth=7;bg.beginPath();bg.arc(1016,120,25,0,Math.PI*2);bg.stroke();
  bg.lineCap='round';bg.beginPath();bg.moveTo(1035,139);bg.lineTo(1057,161);bg.stroke();

  // Labels/icons.
  bg.fillStyle='rgba(255,255,255,.95)';
  bg.font='400 29px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial';
  bg.textAlign='center';bg.textBaseline='middle';
  bg.fillText('Ещё',165,169);
  bg.fillText('Контакты',514,169);
  bg.fillText('Клавиатура',752,169);

  // back/other icon
  bg.strokeStyle='#fff';bg.lineWidth=4;bg.lineCap='round';
  bg.beginPath();bg.moveTo(212,72);bg.lineTo(212,103);bg.lineTo(191,103);bg.stroke();

  // Contacts icon.
  bg.beginPath();bg.arc(513,77,9,0,Math.PI*2);bg.stroke();
  bg.beginPath();bg.arc(513,101,23,Math.PI,0);bg.stroke();

  // 3x3 keyboard dots.
  bg.fillStyle='#fff';
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){
    bg.beginPath();bg.arc(724+i*27,76+j*25,10.5,0,Math.PI*2);bg.fill();
  }
}
drawBackground();

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const texture=new THREE.CanvasTexture(bgCanvas);
texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;

const state={x:245,y:123,w:365,h:220,r:108,thick:52,bezel:76,ior:2.35,blur:.8,spec:.62,tint:.035,shadow:.48};
const uniforms={
 uResolution:{value:new THREE.Vector2(1,1)},uGlassCenter:{value:new THREE.Vector2(state.x,state.y)},
 uGlassSize:{value:new THREE.Vector2(state.w,state.h)},uRadius:{value:state.r},
 uBezel:{value:state.bezel},uThickness:{value:state.thick},uIOR:{value:state.ior},
 uBlur:{value:state.blur},uSpecular:{value:state.spec},uTint:{value:state.tint},
 uShadow:{value:state.shadow},uBgTex:{value:texture},uBgAspect:{value:W/H}
};

const vertexShader=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`;

const fragmentShader=`
precision highp float;
varying vec2 vUv;
uniform vec2 uResolution,uGlassCenter,uGlassSize;
uniform float uRadius,uBezel,uThickness,uIOR,uBlur,uSpecular,uTint,uShadow,uBgAspect;
uniform sampler2D uBgTex;

float sdRoundedRect(vec2 p,vec2 halfSize,float r){
 vec2 q=abs(p)-halfSize+r;
 return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r;
}
float surfaceHeight(float t){float s=1.0-t;return pow(1.0-s*s*s*s,.25);}
vec3 sampleBg(vec2 uv){
 float sa=uResolution.x/uResolution.y;
 if(uBgAspect>sa){float s=sa/uBgAspect;uv.x=uv.x*s+(1.0-s)*.5;}
 else{float s=uBgAspect/sa;uv.y=uv.y*s+(1.0-s)*.5;}
 uv.y=1.0-uv.y;
 return texture2D(uBgTex,uv).rgb;
}
vec3 sampleBlur(vec2 uv,float rad){
 if(rad<.5)return sampleBg(uv);
 vec3 sum=vec3(0.0);vec2 px=1.0/uResolution;
 vec2 o[12];
 o[0]=vec2(-.94,-.40);o[1]=vec2(.95,-.77);o[2]=vec2(-.09,-.93);o[3]=vec2(.34,.29);
 o[4]=vec2(-.82,.49);o[5]=vec2(-.38,-.56);o[6]=vec2(-.13,.85);o[7]=vec2(.90,.41);
 o[8]=vec2(.18,-.30);o[9]=vec2(.60,.71);o[10]=vec2(.50,-.47);o[11]=vec2(-.61,.07);
 for(int i=0;i<12;i++)sum+=sampleBg(uv+o[i]*rad*px);
 return sum/12.0;
}
void main(){
 vec2 screenPx=vec2(vUv.x,1.0-vUv.y)*uResolution;
 vec2 p=screenPx-uGlassCenter,halfSize=uGlassSize*.5;
 float sd=sdRoundedRect(p,halfSize,uRadius);
 if(sd>0.0){
   float a=uShadow*exp(-sd*sd/700.0)*.48;
   gl_FragColor=vec4(0.0,0.0,0.0,a);return;
 }
 float edge=-sd;
 float bezel=min(uBezel,min(uRadius,min(halfSize.x,halfSize.y))-1.0);
 float t=clamp(edge/bezel,0.0,1.0);
 float h=surfaceHeight(t),dt=.001,h2=surfaceHeight(min(t+dt,1.0));
 float dh=(h2-h)/dt;
 float slope=atan(dh*(uThickness/bezel));
 float sinR=clamp(sin(slope)/uIOR,-1.0,1.0);
 float theta=asin(sinR);
 float disp=h*uThickness*(tan(slope)-tan(theta));
 vec2 grad;
 float eps=.5;
 grad.x=sdRoundedRect(p+vec2(eps,0.0),halfSize,uRadius)-sd;
 grad.y=sdRoundedRect(p+vec2(0.0,eps),halfSize,uRadius)-sd;
 grad=normalize(grad);
 vec2 refrUV=screenPx/uResolution-grad*disp/uResolution;
 vec3 color=sampleBlur(refrUV,uBlur);
 vec2 lightDir=normalize(vec2(.5,-.7));
 float rim=abs(dot(grad,lightDir));
 float fall=1.0-smoothstep(0.0,bezel*.4,edge);
 color+=vec3(pow(rim*fall,1.5)*uSpecular);
 float inner=1.0-smoothstep(0.0,bezel*.6,edge);
 color*=mix(1.0,.72,inner*.28);
 float ir=smoothstep(0.0,2.0,edge)*(1.0-smoothstep(2.0,5.0,edge));
 color+=vec3(ir*.18*uSpecular);
 color=mix(color,vec3(1.0),uTint);
 float alpha=smoothstep(0.0,1.5,edge);
 gl_FragColor=vec4(color,alpha);
}`;

const material=new THREE.ShaderMaterial({vertexShader,fragmentShader,uniforms,transparent:true,depthTest:false});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

const hit=document.getElementById('hit');
let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0,vx=0,vy=0,last=0;
let animating=false, targetX=state.x, targetY=state.y, animToken=0;
let stretch=1, stretchTarget=1, lastAnimX=state.x, lastAnimY=state.y;

function metrics(){
 const r=stage.getBoundingClientRect();
 const sx=r.width/W,sy=r.height/H;
 return {sx,sy};
}
function sync(){
 const m=metrics();
 hit.style.transform=`scaleX(${stretch}) scaleY(${1+(stretch-1)*0.35})`;

 hit.style.left=(state.x-state.w/2)*m.sx+'px';
 hit.style.top=(state.y-state.h/2)*m.sy+'px';
 hit.style.width=state.w*m.sx+'px';
 hit.style.height=state.h*m.sy+'px';
 hit.style.borderRadius=state.r*m.sx+'px';
 uniforms.uResolution.value.set(rw(),rh());
 uniforms.uGlassCenter.value.set(state.x*m.sx,state.y*m.sy);
 uniforms.uGlassSize.value.set(state.w*m.sx,state.h*m.sy);
 uniforms.uRadius.value=state.r*m.sx;
 uniforms.uBezel.value=state.bezel*m.sx;
 uniforms.uThickness.value=state.thick*m.sx;
}
function rw(){return stage.clientWidth}
function rh(){return stage.clientHeight}

const targets = {
  more: {x:250, y:123},
  contacts: {x:515, y:123},
  keyboard: {x:755, y:123}
};
let selected = 'more';

function nearestTarget(){
  let best='more',bd=Infinity;
  for(const [name,t] of Object.entries(targets)){
    const d=(state.x-t.x)**2+(state.y-t.y)**2;
    if(d<bd){bd=d;best=name}
  }
  return best;
}

function setTarget(name, instant=false){
  const t=targets[name];
  selected=name;
  targetX=t.x; targetY=t.y;
  const token=++animToken;
  animating=!instant;
  hit.classList.remove('snap');
  if(instant){
    state.x=t.x; state.y=t.y;
    sync();
    return;
  }
  hit.classList.add('snap');
  // Animation is driven by the render loop so the WebGL glass itself
  // moves continuously instead of teleporting to the next tab.
  setTimeout(()=>{
    if(token===animToken) hit.classList.remove('snap');
  },420);
}

function snapToNearest(){
  setTarget(nearestTarget());
}

hit.addEventListener('pointerdown',e=>{
  e.preventDefault();
  hit.setPointerCapture(e.pointerId);
  drag=true; moved=false; animating=false; ++animToken; stretchTarget=1;
  const m=metrics();
  sx=e.clientX; sy=e.clientY; ox=state.x; oy=state.y;
  last=performance.now();
  hit.classList.add('drag');
});

hit.addEventListener('pointermove',e=>{
  if(!drag)return;
  const m=metrics(),now=performance.now(),dt=Math.max(1,now-last);
  const x=ox+(e.clientX-sx)/m.sx;
  const y=oy+(e.clientY-sy)/m.sy;
  moved=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5;
  vx=(x-state.x)/dt*16; vy=(y-state.y)/dt*16; last=now;
  state.x=Math.max(state.w/2,Math.min(W-state.w/2,x));
  state.y=Math.max(state.h/2,Math.min(H-state.h/2,y));
  sync();
});

function release(){
  if(!drag)return;
  drag=false;
  hit.classList.remove('drag');

  if(moved){
    // iOS-like magnetic snap: velocity slightly influences the chosen destination.
    const projectedX=state.x+vx*4;
    const projectedY=state.y+vy*4;
    let best='more',bd=Infinity;
    for(const [name,t] of Object.entries(targets)){
      const d=(projectedX-t.x)**2+(projectedY-t.y)**2;
      if(d<bd){bd=d;best=name}
    }
    setTarget(best);
  }else{
    snapToNearest();
  }
}

hit.addEventListener('pointerup',release);
hit.addEventListener('pointercancel',release);

// Tapping a tab moves the glass to that tab.
// The glass itself remains draggable afterwards.
document.getElementById('nav-more').addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation(); setTarget('more');
});
document.getElementById('nav-contacts').addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation(); setTarget('contacts');
});
document.getElementById('nav-keyboard').addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation(); setTarget('keyboard');
});

// Double behavior: quick horizontal swipe anywhere in the bar switches tabs.
let swipeStart=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target===hit || e.target.classList.contains('nav-hit')) return;
  swipeStart={x:e.clientX,y:e.clientY};
});
stage.addEventListener('pointerup',e=>{
  if(!swipeStart)return;
  const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
  swipeStart=null;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.25){
    const names=['more','contacts','keyboard'];
    let i=names.indexOf(selected);
    i=dx<0?Math.min(2,i+1):Math.max(0,i-1);
    setTarget(names[i]);
  }
});

// Press feedback: subtle elastic deformation while holding.
hit.addEventListener('pointerdown',()=>{stretchTarget=1.025});
hit.addEventListener('pointerup',()=>{stretchTarget=1});
hit.addEventListener('pointercancel',()=>{stretchTarget=1});

window.addEventListener('resize',sync);

function render(){
 const u=material.uniforms;

 if(animating && !drag){
   const dx=targetX-state.x, dy=targetY-state.y;
   const dist=Math.hypot(dx,dy);
   const step=Math.min(1,0.12+dist/1100);
   state.x += dx*step;
   state.y += dy*step;

   // Stretch along the direction of travel: more speed = slightly wider glass.
   const speed=Math.min(1,Math.hypot(state.x-lastAnimX,state.y-lastAnimY)/18);
   const travel=Math.min(1,Math.abs(dx)/170);
   stretchTarget=Math.max(stretchTarget,1+travel*.075);
   if(dist<.35){
     state.x=targetX;state.y=targetY;animating=false;
     stretchTarget=1;
   }
   lastAnimX=state.x; lastAnimY=state.y;
 }
 stretch += (stretchTarget-stretch)*.18;
 if(!animating && !drag) stretchTarget=1;

 sync();
 u.uResolution.value.set(rw(),rh());
 renderer.setSize(rw(),rh(),false);
 renderer.render(scene,camera);
 requestAnimationFrame(render);
}
sync();render();
})();
</script>
</body>
</html>
