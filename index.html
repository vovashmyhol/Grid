<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass Tab Bar</title>
<style>
:root{--u:.34px;--blue:#4f83f1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:560px){:root{--u:.46px}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;gap:calc(24*var(--u))}
.matte{border-radius:999px;background:#262626;border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.5)}
.glass{border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 16px -4px rgba(255,255,255,.45),0 10px 26px rgba(0,0,0,.4)}
.solid{background:#454545;border-radius:999px;opacity:calc(1 - var(--p))}
.thumb{opacity:var(--p);overflow:hidden}
.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#3c3c3c}
.lens .tabs{inset:auto;left:calc(-12*var(--u) - var(--x)*273*var(--u) - 1px);top:calc(-12*var(--u) - 1px);width:calc(843*var(--u));height:calc(190*var(--u))}
.lens .gap,.lens .tab.on .gap{stroke:#3c3c3c}
.fb{-webkit-backdrop-filter:blur(3px) saturate(1.4);backdrop-filter:blur(3px) saturate(1.4)}
.bar{position:relative;width:calc(843*var(--u));height:calc(190*var(--u));touch-action:none;cursor:grab}
.bar.down{cursor:grabbing}
.base{position:absolute;inset:0}
.circle{position:relative;width:calc(191*var(--u));height:calc(191*var(--u));display:grid;place-items:center;cursor:pointer;color:#fff;transition:scale .4s cubic-bezier(.3,1.5,.5,1)}
.circle:active{scale:1.12}
.circle svg{height:calc(70*var(--u));width:auto}
.thumb,.solid{position:absolute;top:calc(12*var(--u));left:calc(12*var(--u) + var(--x)*273*var(--u));width:calc(273*var(--u));height:calc(165*var(--u));scale:var(--sx) var(--sy);pointer-events:none}
.tabs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,calc(273*var(--u)));padding:0 calc(12*var(--u));pointer-events:none}
.tab{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(10*var(--u));font-size:calc(30*var(--u));font-weight:600;line-height:1.2;color:#fff;transition:color .25s;pointer-events:auto}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-4px;border-radius:999px}
.tab.on{color:var(--blue)}
.gap{stroke:#262626;transition:stroke .25s}
.tab.on .gap{stroke:#454545}
.ico{height:calc(70*var(--u));display:grid;place-items:center}
.ico svg{height:100%;width:auto;display:block}
.av{width:calc(76*var(--u));height:calc(76*var(--u));border-radius:50%;background:#7d8a97 url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCABLAEsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDwaiiun8OeC59St01K8Vo7AvtUDhpfp6D3ppXAxdJ0XUteuhaaXZT3cx/hjXOPqegHua7Ox+CviGYgX09nZHO0oXLup/4Dx+teyeDdCt20hW0qOGzhgUMwQYHTOSe5Pqage6czM3mZy3NbRppmUptHnMXwJEjyo/iRUaMZ/wCPMkH2zvqnd/AjWxazXNhqenXSw9Y3ZonI9sgj9a9pjs2u7WSS2DyTHBcqOgHtWdpNjcahdGJ2eG2BxJLtztHrScIgpM+adU0PUtEk8vULOWA5wGIyrH2YcH8DVGvu/TvBHhm30l4Lu1hv4Lhdr/aUDKw+hr59+NPwQs/DZfWfCnnGyJzNYtljD7oTyV9jyPU9sOZN6GuvU8SopaKYHX/DXwZ/wlWsGW6QnTrMq83YSHtHn3xz7fUV6pqmmDTrS+tIxhImWWEAceWen5VsfD7w0nh/wLYxbAtxOv2ic453vzz9BgfhV3UtN/tLTZGUfvkRlIHdT/gea2jGyJuQfCbUcadqto0hBeBdoB5OCR/I1q6d4Rl8wS3DKnmkiNHOcn3rmfhTMltrSI+wCeKRRuHAI5Feoai15cSwmBYWxjPzZIPqKSk1oTJJ6kOiaK9rI7pcncw2MsecenWt3TbPT9MiW1Tyw8uflJ+Z+efrVHTkkt9VdJLnZlA/J+Y565HTFVLqa3GrpMz3AEKMkcYHc9GJ/wA9Kzd5PQpNRN28d7BQTJuP8KHoPSue1u+tpJonkZAwOVQnIBx1AqCG+ktzIl5DcXE4YkO3K7TUtwNKutjsWVyp5x92nGPK9Qcr7Hzh8YvA66LfDXdPg8uxu5NssajiKU85A7BuT7HPqK82r668R+HNN8TaHe6U7yv58RAmlP3Gx8rY9mxXyRPDJbzSQyqVkjYoynsQcEUSWoRZ9hwqj2LpnaoXI9Bis2wvYra4dZJEwF3tk4+Xpn9KzdV1qS3v7XTFikEVyuRIF3JKp4K8dCCRgd81Vl0GawuIjcSu0ixGBtp4KnORnr3H5fWuixKMu0A0jxAApwiXEgGP7pbj9K9EvvFfh7w </style>
</head>
<body>
<div class="dock">
  <div class="bar" id="bar" style="--x:1;--sx:1;--sy:1;--p:0">
    <div class="matte base" id="base"></div>
    <div class="solid"></div>
    <div class="tabs" id="tabs">
      <button class="tab" aria-label="Контакты">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="9.2" r="3.9" fill="#1c1c1e"/><path d="M4.2 19.6C5.7 16.6 8.6 15.2 12 15.2s6.3 1.4 7.8 4.4A11.9 11.9 0 0 1 12 24a11.9 11.9 0 0 1-7.8-4.4z" fill="#1c1c1e"/></svg></span>
        <span>Контакты</span>
      </button>
      <button class="tab on" aria-label="Чаты">
        <span class="ico"><svg viewBox="0 0 40 34"><ellipse cx="27.5" cy="14.5" rx="12" ry="10.5" fill="currentColor" opacity=".5"/><path d="M31 24l5.5 7c-3.4-.3-7-2-10.5-5.5z" fill="currentColor" opacity=".5"/><g class="gap" stroke-width="2.8" paint-order="stroke"><ellipse cx="16" cy="13.5" rx="15" ry="12.5" fill="currentColor"/><path d="M9 23L4 31.5c4-.5 7.5-2.5 10-5z" fill="currentColor"/></g></svg></span>
        <span>Чаты</span>
      </button>
      <button class="tab" aria-label="Настройки">
        <span class="ico"><span class="av"></span></span>
        <span>Настройки</span>
      </button>
    </div>
    <div class="glass thumb" id="thumb"><div class="lens" id="lens"></div></div>
  </div>
  <div class="matte circle" id="search" role="button" tabindex="0" aria-label="Поиск">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11.5" cy="11.5" r="8"/><path d="M17.5 17.5L25 25"/></svg>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" color-interpolation-filters="sRGB"><defs id="defs"></defs></svg>
<script>
// Liquid Glass: SVG feDisplacementMap + backdrop-filter (техника archisvaze/liquid-glass)
const surf = x => Math.pow(1 - Math.pow(1 - x, 4), .25);
function profile(T, B, ior, N = 128) {
  const eta = 1 / ior, p = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const x = i / N, y = surf(x), dx = x < 1 ? 1e-4 : -1e-4;
    const d = (surf(x + dx) - y) / dx, m = Math.hypot(d, 1), nx = -d / m, ny = -1 / m;
    const k = 1 - eta * eta * (1 - ny * ny);
    if (k < 0) continue;
    const s = Math.sqrt(k);
    p[i] = -(eta * ny + s) * nx * ((y * B + T) / (eta - (eta * ny + s) * ny));
  }
  return p;
}
function maps(w, h, r, B, p, mx) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); return [c, x, x.createImageData(w, h)]; };
  const [c1, x1, i1] = mk(), [c2, x2, i2] = mk(), a = i1.data, b = i2.data;
  const N = p.length, wB = w - 2 * r, hB = h - 2 * r, Bs = B * 2.5, sx = Math.cos(Math.PI / 3), sy = Math.sin(Math.PI / 3);
  for (let i = 0; i < a.length; i += 4) { a[i] = a[i + 1] = 128; a[i + 3] = 255; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const X = x < r ? x - r : x >= w - r ? x - r - wB : 0, Y = y < r ? y - r : y >= h - r ? y - r - hB : 0;
    const d2 = X * X + Y * Y;
    if (d2 > (r + 1) ** 2) continue;
    const d = Math.sqrt(d2);
    if (!d) continue;
    const op = d < r ? 1 : 1 - (d - r), k = (y * w + x) * 4, cs = X / d, sn = Y / d, fs = r - d;
    if (op <= 0) continue;
    if (d2 >= Math.max(r - B, 0) ** 2) {
      const disp = p[Math.min(Math.max(fs / B * N, 0) | 0, N - 1)] || 0;
      a[k] = (128 + (-cs * disp / mx) * 127 * op + .5) | 0;
      a[k + 1] = (128 + (-sn * disp / mx) * 127 * op + .5) | 0;
    }
    if (d2 >= Math.max(r - Bs, 0) ** 2) {
      const dot = Math.abs(cs * sx + (-sn) * sy), edge = Math.sqrt(Math.max(0, 1 - (1 - fs) ** 2)), co = dot * edge, col = (255 * co) | 0;
      b[k] = b[k + 1] = b[k + 2] = col; b[k + 3] = (col * co * op) | 0;
    }
  }
  x1.putImageData(i1, 0, 0); x2.putImageData(i2, 0, 0);
  return [c1.toDataURL(), c2.toDataURL()];
}
// Сильное стекло: толстое, высокий IOR, усиленное смещение и блик
function filterFor(el, id) {
  const w = el.offsetWidth, h = el.offsetHeight;
  if (w < 2 || h < 2) return '';
  const r = h / 2, B = Math.min(h * .34, r - 1), p = profile(h * .42, B, 1.9);
  const mx = Math.max(...Array.from(p, Math.abs)) || 1, [disp, spec] = maps(w, h, r, B, p, mx);
  return `<filter id="${id}" x="0%" y="0%" width="100%" height="100%">
<feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="bl"/>
<feImage href="${disp}" x="0" y="0" width="${w}" height="${h}" result="dm"/>
<feDisplacementMap in="bl" in2="dm" scale="${mx * .4}" xChannelSelector="R" yChannelSelector="G" result="dp"/>
<feColorMatrix in="dp" type="saturate" values="5" result="ds"/>
<feImage href="${spec}" x="0" y="0" width="${w}" height="${h}" result="sl"/>
<feComposite in="ds" in2="sl" operator="in" result="sm"/>
<feComponentTransfer in="sl" result="sf"><feFuncA type="linear" slope="1"/></feComponentTransfer>
<feBlend in="sm" in2="dp" mode="normal" result="ws"/>
<feBlend in="sf" in2="ws" mode="normal"/></filter>`;
}
const isChromium = /Chrome\//.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const bar = $('bar'), base = $('base'), thumb = $('thumb'), search = $('search');
const lens = $('lens'), glassEls = [[lens, 'lg-thumb']];
function rebuild() {
  $('defs').innerHTML = glassEls.map(([el, id]) => filterFor(el, id)).join('');
  glassEls.forEach(([el, id]) => el.style.filter = `url(#${id})`);
}
let t;
const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(rebuild, 80); });
glassEls.forEach(([el]) => ro.observe(el));
rebuild();

// Переключатель: «каплю» можно таскать туда-сюда, пока палец зажат; при отпускании она примагничивается
const tabs = [...$('tabs').children], tabsEl = $('tabs');
const clone = tabsEl.cloneNode(true); clone.removeAttribute('id'); clone.setAttribute('aria-hidden', 'true');
clone.querySelectorAll('button').forEach(b => b.tabIndex = -1); lens.appendChild(clone);
const cloneTabs = [...clone.children];
let cur = 1, target = 1, press = 0, down = false, grab = 0, active = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function setActive(i) { if (i === active) return; active = i; [tabs, cloneTabs].forEach(arr => arr.forEach((el, n) => el.classList.toggle('on', n === i))); }
function ptr(e) {
  const rc = tabsEl.getBoundingClientRect(), w = tabs[0].offsetWidth, pad = (rc.width - w * 3) / 2;
  return (e.clientX - rc.left - pad) / w;
}
function place(p) {
  const raw = p - .5 - grab;
  target = raw < 0 ? raw * .3 : raw > 2 ? 2 + (raw - 2) * .3 : raw; // лёгкое сопротивление у краёв
  setActive(clamp(Math.round(raw), 0, 2));
}
bar.addEventListener('pointerdown', e => {
  bar.setPointerCapture(e.pointerId); down = true; bar.classList.add('down');
  const p = ptr(e); grab = Math.abs(p - (cur + .5)) < .5 ? p - (cur + .5) : 0; place(p);
});
bar.addEventListener('pointermove', e => { if (down) place(ptr(e)); });
['pointerup', 'pointercancel'].forEach(n => bar.addEventListener(n, () => {
  if (!down) return; down = false; bar.classList.remove('down'); target = active;
}));
tabs.forEach((el, n) => el.addEventListener('click', e => { if (e.detail === 0) { target = n; setActive(n); } }));
let last = performance.now();
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  const v = target - cur;
  cur += v * (1 - Math.exp(-dt * (down ? 12 : 6.5)));
  press += ((down ? 1 : 0) - press) * (1 - Math.exp(-dt * 10));
  const st = Math.min(.05, Math.abs(v) * .12), boost = Math.min(1, Math.abs(v) * 2.5), s = 1 + .07 * Math.max(press, boost);
  bar.style.setProperty('--x', cur.toFixed(4));
  bar.style.setProperty('--sx', (s * (1 + st)).toFixed(4));
  bar.style.setProperty('--sy', (s * (1 - st * .4)).toFixed(4));
  bar.style.setProperty('--p', press.toFixed(3));
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
