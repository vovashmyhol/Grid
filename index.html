<style>

  box-shadow:inset 0 0 8px rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.3)}
/* кантик: ярче на ровных верхе и низе, к скруглённым краям угасает; по бокам почти нет */
.matte::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;filter:blur(.7px);
  background:linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.14) 16%,rgba(255,255,255,.25) 36%,rgba(255,255,255,.27) 50%,rgba(255,255,255,.25) 64%,rgba(255,255,255,.14) 84%,rgba(255,255,255,.03) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#454545}

.lens .gap,.lens .tab.on .gap{stroke:#454545}
.fb{-webkit-backdrop-filter:blur(3px) saturate(1.4);backdrop-filter:blur(3px) saturate(1.4)}
.bar{position:relative;width:calc(843*var(--u));height:calc(190*var(--u));touch-action:none;cursor:grab}
.bar.down{cursor:grabbing}
.base{position:absolute;inset:0}
.circle{position:relative;width:calc(191*var(--u));height:calc(191*var(--u));display:grid;place-items:center;cursor:grab;color:#fff;touch-action:none;translate:var(--ox,0px) var(--oy,0px);scale:var(--cx,1) var(--cy,1)}
.circle>svg{opacity:calc(1 - var(--sp,0))}
.sthumb{position:absolute;inset:0;overflow:hidden;opacity:var(--sp,0);pointer-events:none}
.sclone{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.circle svg{height:calc(70*var(--u));width:auto}
.thumb,.solid{position:absolute;top:calc(12*var(--u));left:calc(12*var(--u) + var(--x)*273*var(--u));width:calc(273*var(--u));height:calc(165*var(--u));translate:calc(var(--tx)*var(--u)) 0;scale:var(--sx) var(--sy);pointer-events:none}
.tabs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,calc(273*var(--u)));padding:0 calc(12*var(--u));pointer-events:none}
.tab{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(10*var(--u));font-size:calc(30*var(--u));font-weight:600;line-height:1.2;color:#fff;transition:color .25s;pointer-events:auto}

.tab.on{color:var(--blue)}
.gap{stroke:#262626;transition:stroke .25s}
.tab.on .gap{stroke:#454545}
.ico{height:calc(70*var(--u));display:grid;place-items:center}
.ico svg{height:100%;width:auto;display:block}
.av{width:calc(62*var(--u));height:calc(62*var(--u));border-radius:50%;background:#7d8a97 center/cover no-repeat;display:grid;place-items:center;overflow:hidden;transition:box-shadow .25s}

.av.has svg{display:none}
.tab.on .av{box-shadow:0 0 0 calc(3*var(--u)) var(--blue)}

.list::-webkit-scrollbar{display:none}
.sec{padding:14px 0 6px;font-size:14px;font-weight:600;color:#8e8e93}
.row{display:flex;align-items:center;gap:12px;height:62px;position:relative}

.ri{min-width:0}
.rn{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{margin-top:2px;font-size:14px;color:#8e8e93}

.glass.soft{border:1px solid rgba(255,255,255,.02);box-shadow:0 6px 16px rgba(0,0,0,.4)}

.scrim{position:fixed;inset:0;z-index:9;display:none;touch-action:none}

.menu.on{opacity:1;visibility:visible;transform:none;transition:transform .34s cubic-bezier(.2,1.3,.35,1),opacity .16s,visibility 0s}
.mi{position:relative;height:44px;margin:0 8px;padding-left:53px;display:flex;align-items:center;border-radius:18px;font-size:17px;color:#fff;white-space:nowrap;transition:background .12s}
.mi.hl{background:rgba(255,255,255,.14)}

.mi.sel .ck{opacity:1}

</style>

<script>
// Liquid Glass: SVG feDisplacementMap + backdrop-filter (техника archisvaze/liquid-glass)
const surf = x => Math.pow(1 - Math.pow(1 - x, 4), .25);
function profile(T, B, ior, N = 128) {
  const eta = 1 / ior, p = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const x = i / N, y = surf(x), dx = x < 1 ? 1e-4 : -1e-4;

    const s = Math.sqrt(k);
    p[i] = -(eta * ny + s) * nx * ((y * B + T) / (eta - (eta * ny + s) * ny));
  }
  return p;
}
const k0 = (x, y, w) => (y * w + x) * 4 + 3; // альфа-канал блика: в центральной строке блика нет
function maps(w, h, r, B, p, mx) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); return [c, x, x.createImageData(w, h)]; };
  const [c1, x1, i1] = mk(), [c2, x2, i2] = mk(), a = i1.data, b = i2.data;
  const N = p.length, wB = w - 2 * r, hB = h - 2 * r, Bs = B * 2.5, sx = Math.cos(Math.PI / 3), sy = Math.sin(Math.PI / 3);
  for (let i = 0; i < a.length; i += 4) { a[i] = a[i + 1] = 128; a[i + 3] = 255; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const X = x < r ? x - r : x >= w - r ? x - r - wB : 0, Y = y < r ? y - r : y >= h - r ? y - r - hB : 0;
    const d2 = X * X + Y * Y;

      a[k + 1] = (128 + (-sn * disp / mx) * 127 * op + .5) | 0;

// Сильное стекло: толстое, высокий IOR, усиленное смещение и блик
function filterFor(el, id) {

<feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="bl"/>
<feImage href="${disp}" x="0" y="0" width="${w}" height="${h}" result="dm"/>
<feDisplacementMap in="bl" in2="dm" scale="${mx * (soft ? .1 : .4)}" xChannelSelector="R" yChannelSelector="G" result="dp"/>
<feColorMatrix in="dp" type="saturate" values="5" result="ds"/>

const isChromium = /Chrome\//.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
const $ = id => document.getElementById(id);

const bdEls = [[base, 'bd-base'], [search, 'bd-search'], [$('sortBtn'), 'bd-sort'], [$('plusBtn'), 'bd-plus']];
bdEls.forEach(([el]) => el.dataset.soft = '1');
const lens = $('lens'), slens = $('slens'), lensSort = $('lensSort'), lensPlus = $('lensPlus'), glassEls = [[lens, 'lg-thumb'], [slens, 'lg-search'], [lensSort, 'lg-sort'], [lensPlus, 'lg-plus']];
[['lensSort', 'sortBtn'], ['lensPlus', 'plusBtn']].forEach(([l, b]) => $(l).innerHTML = '<div class="sclone">' + $(b).querySelector('.gc').outerHTML + '</div>');
slens.innerHTML = '<div class="sclone">' + search.querySelector('svg').outerHTML + '</div>';
function rebuild() {
  $('defs').innerHTML = glassEls.concat(isChromium ? bdEls : []).map(([el, id]) => filterFor(el, id)).join('');

glassEls.concat(bdEls).forEach(([el]) => ro.observe(el));
rebuild();

// Переключатель: «каплю» можно таскать туда-сюда, пока палец зажат; при отпускании она примагничивается
const tabs = [...$('tabs').children], tabsEl = $('tabs');
const clone = tabsEl.cloneNode(true); clone.removeAttribute('id'); clone.setAttribute('aria-hidden', 'true');
clone.querySelectorAll('button').forEach(b => b.tabIndex = -1); lens.appendChild(clone);
const cloneTabs = [...clone.children];
let cur = 1, vel = 0, target = 1, press = 0, pvel = 0, down = false, grab = 0, active = 1;
let pRaw = 1, pT = 0, pV = 0, mv = 0, mvv = 0, wasMoving = false, lag = 1, lagv = 0; // скорость пальца (в табах/сек)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function setActive(i) { if (i === active) return; active = i; $('v0').classList.toggle('on', i === 0); [tabs, cloneTabs].forEach(arr => arr.forEach((el, n) => el.classList.toggle('on', n === i))); }
function ptr(e) {
  const rc = tabsEl.getBoundingClientRect(), w = tabs[0].offsetWidth, pad = (rc.width - w * 3) / 2;
  return (e.clientX - rc.left - pad) / w;
}
function place(p, now) {
  const raw = p - .5 - grab;
  target = raw < 0 ? raw * .3 : raw > 2 ? 2 + (raw - 2) * .3 : raw; // сопротивление у краёв
  if (pT) { const dt = Math.max(.008, (now - pT) / 1000); pV += ((raw - pRaw) / dt - pV) * .35; }
  pRaw = raw; pT = now;

}
bar.addEventListener('pointerdown', e => {
  bar.setPointerCapture(e.pointerId); down = true; bar.classList.add('down');
  pV = 0; pT = 0;
  const p = ptr(e); grab = Math.abs(p - (cur + .5)) < .5 ? p - (cur + .5) : 0; place(p, e.timeStamp);
});
bar.addEventListener('pointermove', e => { if (down) place(ptr(e), e.timeStamp); });
['pointerup', 'pointercancel'].forEach(n => bar.addEventListener(n, e => {
  if (!down) return; down = false; bar.classList.remove('down');
  if (e.timeStamp - pT > 90) pV = 0;           // палец стоял — инерции нет
  pV = clamp(pV, -9, 9);
  const dest = clamp(Math.round(pRaw + pV * .1), 0, 2); // бросок «перебрасывает» каплю дальше
  target = dest; setActive(dest);
  vel += pV * .15;                              // импульс при отпускании
}));
tabs.forEach((el, n) => el.addEventListener('click', e => { if (e.detail === 0) { target = n; setActive(n); } }));
// Стеклянные кнопки: «тугая» жидкая капля — тянется с сопротивлением, растёт при зажатии, пружинит назад
const sU = () => search.offsetWidth / 191;
function glassBtn(el, getL, always, mv = 1) { // mv — какая доля смещения реально двигает кнопку (деформация не зависит)
  let x0 = 0, y0 = 0, d = false, ox = 0, oy = 0, vx = 0, vy = 0, tx = 0, ty = 0, pr = 0, pv = 0;
  const soft = (v, L) => L * Math.tanh(v / (L * 3.4)); // чем дальше тянешь, тем туже
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); d = true; x0 = e.clientX; y0 = e.clientY; tx = ty = 0; });
  el.addEventListener('pointermove', e => { if (!d) return; const L = getL(); tx = soft(e.clientX - x0, L); ty = soft(e.clientY - y0, L); });

    const k = d ? 260 : 150, c = d ? 24 : 9, n = 4, h = dt / n;
    for (let i = 0; i < n; i++) {
      vx += (-k * (ox - tx) - c * vx) * h; ox += vx * h;
      vy += (-k * (oy - ty) - c * vy) * h; oy += vy * h;
      pv += (-230 * (pr - (d ? 1 : 0)) - 16 * pv) * h; pr += pv * h;
    }
    const L = getL(), ax = Math.min(1.3, Math.abs(ox) / L), ay = Math.min(1.3, Math.abs(oy) / L), sc = 1 + .14 * pr;
    el.style.setProperty('--ox', (ox * mv).toFixed(2) + 'px');
    el.style.setProperty('--oy', (oy * mv).toFixed(2) + 'px');
    el.style.setProperty('--cx', (sc * (1 + .14 * ax - .07 * ay)).toFixed(4));
    el.style.setProperty('--cy', (sc * (1 + .14 * ay - .07 * ax)).toFixed(4));
    el.style.setProperty('--sp', always ? 1 : clamp(pr, 0, 1).toFixed(3)); // always — стекло включено постоянно

}
const btnSteps = [glassBtn(search, () => 70 * sU()), glassBtn($('sortBtn'), () => 24, false, .12), glassBtn($('plusBtn'), () => 24, false, .12)];
let last = performance.now();
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  // пружины: на пальце — мягкое следование, после отпускания — недодемпфированная (с перелётом и покачиванием)
  const k = down ? 240 : 170, c = down ? 26 : 17, pk = 230, pc = 15;
  const n = 4, h = dt / n;
  for (let i = 0; i < n; i++) {
    vel += (-k * (cur - target) - c * vel) * h; cur += vel * h;
    pvel += (-pk * (press - (down ? 1 : 0)) - pc * pvel) * h; press += pvel * h;
    lagv += (-190 * (lag - cur) - 10 * lagv) * h; lag += lagv * h; // «отстающее» тело капли
  }
  // без зажатия: пока капля едет, она раздувается ровно до краёв бара (297×190 при исходных 273×165)
  const moving = Math.abs(cur - target) > .1 || Math.abs(vel) > .9;
  { // критически задемпфированная пружина: мягкий старт и мягкая остановка, без рывка и перелёта
    // капля «приехала»: толчок наружу — она на миг раздувается чуть шире краёв бара,
    // затем с покачиванием (недодемпфированная пружина) возвращается и даже чуть недотягивает до нормы
    if (wasMoving && !moving && !down) mvv += 12;
    wasMoving = moving;
    const mk = moving ? 380 : 900, mc = 2 * Math.sqrt(mk) * (moving ? 1 : .75);
    for (let i = 0; i < 4; i++) { mvv += (-mk * (mv - (moving ? 1 : 0)) - mc * mvv) * (dt / 4); mv += mvv * (dt / 4); }
    mv = clamp(mv, -.2, 1.6);
  }
  const g = (mv < 0 && press < .02) ? mv : Math.max(mv, press);
  const st = clamp(Math.abs(vel) * .03, 0, .15) * (down ? 1 : .3);  // растяжение по скорости
  const s = 1 + .088 * g + .082 * press, sy = 1 + .152 * g + .088 * press; // до краёв бара; при зажатии — ещё больше
  bar.style.setProperty('--x', cur.toFixed(4));
  // Границы бара (843×190): капля может чуть выйти за них, дальше — мягкий «подушечный» упор:
  // деформация начинается заранее и нарастает плавно, об стенку она сплющивается и разбухает по высоте
  const sm = (v, m, K) => v <= m - K ? v : m - K * Math.exp(-(v - (m - K)) / K);
  const cx = 12 + cur * 273 + 136.5;
  const horiz = w => [-sm(-(cx - w / 2), 15, 22), sm(cx + w / 2, 858, 22)];
  const jel = clamp(cur - lag, -.35, .35);                    // желе: тянется на ходу, при остановке качнётся и успокоится — даже без удара о стенку
  let sxv = s * (1 + st) * (1 + .3 * jel), syv = sy * (1 - st * .5) * (1 - .15 * jel);

  vel *= 1 - Math.min(.4, cmp * 6 * dt);                      // стенка гасит скорость (мягкая подушка)
  syv *= 1 + .45 * cmp;                                       // сжало по ширине — раздалось по высоте
  const h0 = 165 * syv, h1 = sm(h0, 206, 14);                 // сверху/снизу: выступ до 206, остальное в ширину
  sxv *= Math.sqrt(h0 / h1); syv = h1 / 165;
  [Lc, Rc] = horiz(273 * sxv);
  bar.style.setProperty('--tx', ((Lc + Rc) / 2 - cx).toFixed(3));
  bar.style.setProperty('--sx', ((Rc - Lc) / 273).toFixed(4));
  bar.style.setProperty('--sy', syv.toFixed(4));
  bar.style.setProperty('--p', clamp(g, 0, 1).toFixed(3));
  btnSteps.forEach(f => f(dt));
  requestAnimationFrame(loop);
})(performance.now());

// Демо-контакты без фото (аватар — инициалы на цветном фоне)
const CONTACTS = [
  ['Алексей Смирнов','в сети'],['Анна Ковалёва','был(а) недавно'],['Артём Волков','был(а) 5 минут назад'],
  ['Борис Лебедев','был(а) вчера'],['Даниил Громов','был(а) недавно'],['Дарья Морозова','в сети'],['Дмитрий Орлов','был(а) в 14:20'],
  ['Егор Фёдоров','был(а) недавно'],['Елена Петрова','в сети'],['Игорь Соколов','был(а) вчера'],['Ирина Захарова','был(а) 2 часа назад'],
  ['Кирилл Новиков','был(а) недавно'],['Ксения Беляева','в сети'],['Максим Попов','был(а) на этой неделе'],['Мария Крылова','был(а) недавно'],
  ['Наталья Григорьева','был(а) вчера'],['Никита Борисов','в сети'],['Ольга Тихонова','был(а) недавно'],['Павел Андреев','был(а) 10 минут назад'],
  ['Сергей Кузнецов','был(а) недавно'],['София Миронова','в сети'],['Татьяна Белова','был(а) вчера'],['Юлия Рябова','был(а) недавно'],['Ярослав Комаров','был(а) давно']
];
const AV_COLORS = [['#ff885e','#ff516a'],['#ffcd6a','#ffa85c'],['#82b1ff','#665fff'],['#a0de7e','#54cb68'],['#53edd6','#28c9b7'],['#72d5fd','#2a9ef1'],['#e0a2f3','#d669ed']];
// Порядок «по времени захода»: чем меньше число, тем свежее был(а) в сети
const lastSeenRank = st => st === 'в сети' ? 0 : /(\d+) минут/.test(st) ? +RegExp.$1 : /(\d+) час/.test(st) ? +RegExp.$1 * 60 : /в \d+:\d+/.test(st) ? 300 : st.includes('недавно') ? 1000 : st.includes('вчера') ? 2000 : st.includes('неделе') ? 3000 : 9000;
const NAME_ORDER = CONTACTS.slice().sort((a, b) => a[0].localeCompare(b[0], 'ru'));
let sortMode = 'time';
function renderContacts(mode) {
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const list = mode === 'name' ? NAME_ORDER : CONTACTS.slice().sort((a, b) => lastSeenRank(a[1]) - lastSeenRank(b[1]) || a[0].localeCompare(b[0], 'ru'));
  let html = '', letter = '';
  list.forEach(c => {
    const [name, status] = c;
    if (mode === 'name') { const L = name[0].toUpperCase(); if (L !== letter) { letter = L; html += `<div class="sec">${L}</div>`; } }
    const ini = name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const [c1, c2] = AV_COLORS[NAME_ORDER.indexOf(c) % AV_COLORS.length];
    html += `<div class="row"><div class="ca" style="background:linear-gradient(180deg,${c1},${c2})">${esc(ini)}</div><div class="ri"><div class="rn">${esc(name)}</div><div class="rs${status === 'в сети' ? ' on' : ''}">${esc(status)}</div></div></div>`;
  });
  $('contacts').innerHTML = html;
  $('list').scrollTop = 0;
}
renderContacts(sortMode);

// Вибрация: в Telegram — через HapticFeedback, в обычном браузере (Android) — navigator.vibrate
const hap = (() => {
  const w = window.Telegram && Telegram.WebApp, hf = w && w.platform && w.platform !== 'unknown' && w.HapticFeedback;
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  return {
    impact: s => { try { hf ? hf.impactOccurred(s) : buzz(s === 'medium' ? 18 : 10); } catch (e) {} },
    select: () => { try { hf ? hf.selectionChanged() : buzz(6); } catch (e) {} }
  };
})();

// Меню сортировки
(function sortMenu() {
  const menu = $('menu'), scrim = $('scrim'), items = [...menu.querySelectorAll('.mi')], btn = $('sortBtn');
  let open = false, hl = -1, pressed = false;
  function show() {
    const r = btn.getBoundingClientRect();
    menu.style.left = Math.max(8, r.left) + 'px';
    menu.style.top = (r.bottom + 10) + 'px';
    menu.style.transformOrigin = (r.left + r.width / 2 - Math.max(8, r.left)) + 'px -10px';
    open = true; menu.classList.add('on'); scrim.classList.add('on');
    hap.impact('medium');
  }
  function hide() { open = false; menu.classList.remove('on'); scrim.classList.remove('on'); setHl(-1, true); }
  function setHl(i, quiet) {
    if (i === hl) return;
    const first = hl === -1; hl = i;
    items.forEach((el, n) => el.classList.toggle('hl', n === i));
    if (i >= 0 && !first && !quiet) hap.select(); // вибро-«щелчок» при переходе пальца между пунктами
  }
  const itemAt = e => {
    const m = menu.getBoundingClientRect();
    if (e.clientX < m.left || e.clientX > m.right) return -1;
    return items.findIndex(el => { const r = el.getBoundingClientRect(); return e.clientY >= r.top && e.clientY <= r.bottom; });
  };
  function choose(i) {
    sortMode = items[i].dataset.mode;
    items.forEach((el, n) => { el.classList.toggle('sel', n === i); el.setAttribute('aria-checked', n === i); });
    hap.impact('light');
    renderContacts(sortMode);
    setTimeout(hide, 140);
  }
  btn.addEventListener('click', () => open ? hide() : show());
  scrim.addEventListener('click', hide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) hide(); });
  menu.addEventListener('pointerdown', e => { pressed = true; menu.setPointerCapture(e.pointerId); setHl(itemAt(e)); });
  menu.addEventListener('pointermove', e => { if (pressed) setHl(itemAt(e)); });
  menu.addEventListener('pointerup', e => { if (!pressed) return; pressed = false; const i = itemAt(e); if (i >= 0) choose(i); else setHl(-1, true); });
  menu.addEventListener('pointercancel', () => { pressed = false; setHl(-1, true); });
})();

// Не даём Telegram сворачивать мини-апп свайпом вниз
(function lockSwipe() {
  const w = window.Telegram && Telegram.WebApp;
  try { w && w.ready && w.ready(); w && w.expand && w.expand(); } catch (e) {}
  try { w && w.disableVerticalSwipes && w.disableVerticalSwipes(); } catch (e) {}   // Bot API 7.7+
  // красим шапку, фон и нижнюю панель Telegram в чёрный — без «чёлки» над страницей
  const paint = () => {
    try { w.setHeaderColor && w.setHeaderColor('#000000'); } catch (e) {}      // 6.1+
    try { w.setBackgroundColor && w.setBackgroundColor('#000000'); } catch (e) {}
    try { w.setBottomBarColor && w.setBottomBarColor('#000000'); } catch (e) {} // 7.10+
  };
  if (w) { paint(); w.onEvent && w.onEvent('themeChanged', paint); }
  // запасной вариант для старых клиентов: гасим вертикальный жест на странице без прокрутки
  const listEl = $('list');
  document.addEventListener('touchmove', e => { if (listEl.contains(e.target)) return; if (e.cancelable) e.preventDefault(); }, { passive: false });
  // в самом верху/низу списка сдвигаем на 1px, чтобы старый Telegram не принимал жест за закрытие
  listEl.addEventListener('touchstart', () => {
    if (listEl.scrollTop <= 0) listEl.scrollTop = 1;
    else if (listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight) listEl.scrollTop = listEl.scrollHeight - listEl.clientHeight - 1;
  }, { passive: true });
})();

// Аватарка из Telegram Web App (вне Telegram остаётся силуэт)
function tgPhoto() {
  try { const w = window.Telegram && Telegram.WebApp; w && w.ready && w.ready(); const u = w && w.initDataUnsafe && w.initDataUnsafe.user; if (u && u.photo_url) return u.photo_url; } catch (e) {}
  try { const h = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData'); if (h) { const u = JSON.parse(new URLSearchParams(h).get('user') || 'null'); if (u && u.photo_url) return u.photo_url; } } catch (e) {}
  return null;
}
const photo = tgPhoto();
if (photo) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.onload = () => document.querySelectorAll('.av').forEach(a => { a.style.backgroundImage = `url("${photo}")`; a.classList.add('has'); }); im.src = photo; }
